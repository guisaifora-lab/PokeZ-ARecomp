# Windows release build: produces "ZA-Recomp-windows.zip" as a workflow artifact,
# and as a GitHub release asset when run on a tag (v*) or with "publish" ticked.
# No game code is inside; the start screen compiles it on the player's machine for that
# machine's CPU (runtime/gamelib.c gamelib_cpu: AVX2 where there is one, SSE4.2 + AVX on Ivy Bridge, ...).
name: Windows build
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Also publish it as a GitHub release
        type: boolean
        default: true
  push:
    branches:
      - pokemon-za
      - main
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: LF line endings (the bash tools break with CRLF)
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            make zip unzip
            mingw-w64-ucrt-x86_64-clang mingw-w64-ucrt-x86_64-lld mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-ffmpeg mingw-w64-ucrt-x86_64-vulkan-devel mingw-w64-ucrt-x86_64-shaderc
            mingw-w64-ucrt-x86_64-spirv-tools mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-vulkan-memory-allocator mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-gcc
      - name: LGPL FFmpeg (tools/build_deps_windows.sh)
        run: bash tools/build_deps_windows.sh
      - name: Package Windows Release (tools/za/dist.sh)
        run: |
          ZIP=1 bash tools/za/dist.sh
          ls -la build/dist-za
      - uses: actions/upload-artifact@v4
        with:
          name: ZA-Recomp-windows
          path: build/dist-za/*.zip
          if-no-files-found: error
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { "build-$env:GITHUB_RUN_NUMBER" }
          $zip = Get-ChildItem -Path "build/dist-za" -Filter "*.zip" | Select-Object -First 1 -ExpandProperty Name
          gh release create $tag "build/dist-za/$zip" --clobber --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
            --title "ZA Recomp (Any x86-64 CPU) $tag" `
            --notes "Windows release build. The game code is compiled at setup for your own CPU: AVX2 is no longer required (Ivy Bridge / Sandy Bridge / older CPUs get SSE4.2 + AVX or SSE2 code with an exact fast FMA emulation)."
